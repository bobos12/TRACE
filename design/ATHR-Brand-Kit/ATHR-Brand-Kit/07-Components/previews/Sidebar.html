<!doctype html>
<html lang="en" data-theme="light">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../_shared/fonts.css"><link rel="stylesheet" href="../../_shared/tokens.css"><link rel="stylesheet" href="../../_shared/bundle.css"><script src="../../_shared/react.production.min.js"></script><script src="../../_shared/react-dom.production.min.js"></script><script src="../../_shared/bundle.js"></script><meta charset="utf-8"><title>Sidebar — preview</title></head>
<body>
<div id="root" class=""></div>
<script>
  var A = window.Athr, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(h(A.Sidebar, {client:'Nakheel Logistics', product:'Operations portal', groups:[
    {items:[{label:'Overview', icon:'dashboard'},{label:'Shipments', icon:'layers', count:128, current:true},{label:'Invoices', icon:'file', count:24},{label:'Inbox', icon:'inbox', count:3}]},
    {title:'Manage', items:[{label:'Reports', icon:'chart'},{label:'Team', icon:'user'},{label:'Settings', icon:'sliders'}]}],
    footer: h('div', {style:{display:'flex',alignItems:'center',gap:8,padding:'0 8px',fontSize:12,color:'var(--ink-muted)'}}, 'Built by', h(A.Logo, {size:11}))}));
</script>
<button id="athr-theme" aria-label="Switch light/dark" style="position:fixed;right:16px;bottom:16px;z-index:99;height:36px;padding:0 14px;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface-raised);color:var(--ink);font:500 13px var(--font-sans);cursor:pointer">Light / Dark</button>
<script>(function(){var r=document.documentElement,b=document.getElementById('athr-theme');if(location.hash==='#dark')r.setAttribute('data-theme','dark');b.onclick=function(){r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark')};})();</script>
</body>
</html>
