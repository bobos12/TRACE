<!doctype html>
<html lang="en" data-theme="light">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../_shared/fonts.css"><link rel="stylesheet" href="../_shared/tokens.css"><link rel="stylesheet" href="../_shared/bundle.css"><script src="../_shared/react.production.min.js"></script><script src="../_shared/react-dom.production.min.js"></script><script src="../_shared/bundle.js"></script><meta charset="utf-8"><title>TextField — preview</title></head>
<body>
<div id="root" class="at-col"></div>
<script>
  var A = window.Athr, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'at-grid2', style:{padding:0}},
    h(A.TextField, {label:'Company name', placeholder:'e.g. Nakheel Logistics', defaultValue:'Nakheel Logistics'}),
    h(A.TextField, {label:'Monthly budget', prefix:'SAR', placeholder:'25,000', hint:'A range is fine — we scope around it.'}),
    h(A.TextField, {label:'Work email', defaultValue:'sara@nakheel', error:'Add the domain, e.g. sara@nakheel.sa'}),
    h(A.TextField, {label:'اسم الشركة', dir:'rtl', placeholder:'مثال: نخيل للخدمات اللوجستية', optional:'اختياري'})));
</script>
<button id="athr-theme" aria-label="Switch light/dark" style="position:fixed;right:16px;bottom:16px;z-index:99;height:36px;padding:0 14px;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface-raised);color:var(--ink);font:500 13px var(--font-sans);cursor:pointer">Light / Dark</button>
<script>(function(){var r=document.documentElement,b=document.getElementById('athr-theme');if(location.hash==='#dark')r.setAttribute('data-theme','dark');b.onclick=function(){r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark')};})();</script>
</body>
</html>
