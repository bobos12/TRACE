<!doctype html>
<html lang="en" data-theme="light">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../_shared/fonts.css"><link rel="stylesheet" href="../_shared/tokens.css"><link rel="stylesheet" href="../_shared/bundle.css"><script src="../_shared/react.production.min.js"></script><script src="../_shared/react-dom.production.min.js"></script><script src="../_shared/bundle.js"></script><meta charset="utf-8"><title>Banner — preview</title><style>.at-col{gap:10px}</style></head>
<body>
<div id="root" class="at-col"></div>
<script>
  var A = window.Athr, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(h(F, null,
    h(A.Banner, {tone:'success', title:'Deployed.'}, 'Version 2.4 is live for all branches.'),
    h(A.Banner, {tone:'warning', title:'6 invoices are overdue.', action: h(A.Button, {size:'sm'}, 'Review')}, 'Finance will be reminded tomorrow at 9:00.'),
    h(A.Banner, {tone:'danger', title:'Sync failed.', onClose:function(){}}, 'We could not reach the ERP. Nothing was lost — we retry every 5 minutes.'),
    h(A.Banner, {tone:'accent'}, 'New: approve invoices from your phone.'),
    h(A.Banner, null, 'Read-only while the audit is open.')));
</script>
<button id="athr-theme" aria-label="Switch light/dark" style="position:fixed;right:16px;bottom:16px;z-index:99;height:36px;padding:0 14px;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface-raised);color:var(--ink);font:500 13px var(--font-sans);cursor:pointer">Light / Dark</button>
<script>(function(){var r=document.documentElement,b=document.getElementById('athr-theme');if(location.hash==='#dark')r.setAttribute('data-theme','dark');b.onclick=function(){r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark')};})();</script>
</body>
</html>
