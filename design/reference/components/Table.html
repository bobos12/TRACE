<!doctype html>
<html lang="en" data-theme="light">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../_shared/fonts.css"><link rel="stylesheet" href="../_shared/tokens.css"><link rel="stylesheet" href="../_shared/bundle.css"><script src="../_shared/react.production.min.js"></script><script src="../_shared/react-dom.production.min.js"></script><script src="../_shared/bundle.js"></script><meta charset="utf-8"><title>Table — preview</title></head>
<body>
<div id="root" class="at-col"></div>
<script>
  var A = window.Athr, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(h(A.Table, {columns:[{key:'id',label:'Shipment',render:function(r){return h('span',{style:{fontFamily:'var(--font-mono)',fontSize:13}},r.id)}},{key:'client',label:'Client'},{key:'route',label:'Route',muted:true},{key:'status',label:'Status',render:function(r){return h(A.Badge,{tone:r.tone,dot:true},r.status)}},{key:'value',label:'Value (SAR)',numeric:true}],
    rows:[{id:'NK-24081',client:'Almarai Retail',route:'Riyadh → Dammam',status:'Delivered',tone:'success',value:'48,200'},
      {id:'NK-24082',client:'Sadeem Clinics',route:'Jeddah → Makkah',status:'In transit',tone:'accent',value:'12,950',selected:true},
      {id:'NK-24083',client:'Wared Foods',route:'Riyadh → Qassim',status:'Delayed',tone:'warning',value:'31,400'},
      {id:'NK-24084',client:'Masar Realty',route:'Khobar → Riyadh',status:'Failed pickup',tone:'danger',value:'6,780'}]}));
</script>
<button id="athr-theme" aria-label="Switch light/dark" style="position:fixed;right:16px;bottom:16px;z-index:99;height:36px;padding:0 14px;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface-raised);color:var(--ink);font:500 13px var(--font-sans);cursor:pointer">Light / Dark</button>
<script>(function(){var r=document.documentElement,b=document.getElementById('athr-theme');if(location.hash==='#dark')r.setAttribute('data-theme','dark');b.onclick=function(){r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark')};})();</script>
</body>
</html>
