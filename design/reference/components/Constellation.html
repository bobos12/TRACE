<!doctype html>
<html lang="en" data-theme="light">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../_shared/fonts.css"><link rel="stylesheet" href="../_shared/tokens.css"><link rel="stylesheet" href="../_shared/bundle.css"><script src="../_shared/react.production.min.js"></script><script src="../_shared/react-dom.production.min.js"></script><script src="../_shared/bundle.js"></script><meta charset="utf-8"><title>Constellation — preview</title><style>.at-row{gap:24px;padding:28px 24px}</style></head>
<body>
<div id="root" class="at-row"></div>
<script>
  var A = window.Athr, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(h(F, null, ['ATHR','Nakheel Logistics','Sadeem Clinics','Wared','Masar Realty','Qahwa House'].map(function(n){
    return h('div', {key:n, style:{display:'flex',flexDirection:'column',alignItems:'center',gap:12,width:120}}, h(A.Constellation, {seed:n, size:16}), h('span', {className:'at-cap', style:{textAlign:'center'}}, n));
  })));
</script>
<button id="athr-theme" aria-label="Switch light/dark" style="position:fixed;right:16px;bottom:16px;z-index:99;height:36px;padding:0 14px;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface-raised);color:var(--ink);font:500 13px var(--font-sans);cursor:pointer">Light / Dark</button>
<script>(function(){var r=document.documentElement,b=document.getElementById('athr-theme');if(location.hash==='#dark')r.setAttribute('data-theme','dark');b.onclick=function(){r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark')};})();</script>
</body>
</html>
