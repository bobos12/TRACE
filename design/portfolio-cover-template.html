<!doctype html><!-- Portfolio cover template, 1600x1000. Swap each img src for the project's real screenshots, set the ground colour (carbon #0F0F0D, graphite #1A1A17, sand #D8D1C0, paper #F4F1E9) and which constellation cells are filled, then screenshot the page at 1600x1000. --><html><head><style>body{margin:0;width:1600px;height:1000px;overflow:hidden}.c{position:relative;width:1600px;height:1000px;overflow:hidden}
.br{position:absolute;border-radius:10px;overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.08);background:#fff}
.br .bar{height:34px;background:#E9E4D8;display:flex;align-items:center;gap:8px;padding:0 14px}.br .bar i{width:11px;height:11px;border-radius:50%;background:#B9B1A0}
.br.d .bar{background:#1A1A17}.br.d .bar i{background:#3A3833}.br img{display:block;width:100%}
.ph{position:absolute;filter:drop-shadow(0 40px 60px rgba(0,0,0,.45))}.ph img{display:block;width:100%}
.lat{position:absolute;display:grid;grid-template-columns:repeat(3,26px);gap:8px}.lat i{width:26px;height:26px;transform:rotate(45deg) scale(.7071);background:currentColor}.lat i.o{background:transparent;box-shadow:inset 0 0 0 2px currentColor;opacity:.25}.lat i.m{background:#FF5A33}
.cut{position:absolute;background:#E0461F}</style></head><body><div class="c" style="background:#1A1A17"><div class="br" style="left:120px;top:150px;width:1080px"><div class="bar"><i></i><i></i><i></i></div><img src="../public/images/ui/dashboard-light.png"></div><div class="ph" style="left:1130px;top:250px;width:330px;transform:rotate(0deg)"><img src="../public/images/ui/mobile-home-en-light.png"></div><div class="lat" style="left:1380px;top:70px;color:#F2EEE4"><i class="o"></i><i class=""></i><i class="o"></i><i class="m"></i><i class=""></i><i class="o"></i><i class="o"></i><i class="o"></i><i class=""></i></div></div></body></html>
